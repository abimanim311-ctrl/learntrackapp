<!-- Sidebar Component -->
<nav id="sidebar">
    <div class="sidebar-header d-flex align-items-center justify-content-between">
        <a href="{{ url_for('dashboard') }}" class="text-white text-decoration-none d-flex align-items-center">
            <i class="bi bi-journal-bookmark-fill fs-3 me-2"></i>
            <span class="fs-4">LearnTrack</span>
        </a>
    </div>

    <ul class="list-unstyled components">
        <li>
            <a href="{{ url_for('dashboard') }}">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>

            <a href="{{ url_for('goals_list') }}">

            <a href="{{ url_for('add_goal') }}">

            <a href="{{ url_for('profile') }}">

                <i class="bi bi-shield-lock"></i>
                <span>Admin Panel</span>

        <li class="border-top my-2 border-secondary opacity-50"></li>

            <a href="{{ url_for('logout') }}" class="text-danger-hover">
